name: Bug Report
description: File a bug report
labels: ['bug']
body:
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      description: Which SekoKuva Coding Agent surface are you reporting a bug for?
      options:
        - VS Code Extension
        - CLI
        - Desktop App
      default: 0
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What version are you using? (You can find this at the bottom of the Settings view)
      placeholder: 'e.g., 0.1.0'
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      description: Which model and provider were you using?
      placeholder: 'e.g., sekokuva-ca/default'
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps that reliably reproduce the issue.
      placeholder: |
        1. Open ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any stack traces or log output. Redact secrets.
      render: shell
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, editor version, and anything else relevant.
      placeholder: 'e.g., Windows 11, VS Code 1.101.0'
    validations:
      required: true
